name: CritHit! CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-test:
    name: Backend API & Testcontainers (Java 21 + pgvector)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify Docker daemon for Testcontainers
        run: docker info

      - name: Run Maven unit & Testcontainers integration tests
        run: mvn -B -f apps/api/pom.xml test

  web-test-and-e2e:
    name: Frontend Typecheck, Vitest, Build & Playwright E2E + Axe WCAG AA
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript strict typecheck
        run: npm run typecheck

      - name: Run Vitest unit & component tests
        run: npm test

      - name: Build Next.js production application
        run: npm run build

      - name: Install Playwright Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E & @axe-core/playwright WCAG 2.1 AA audit
        run: npx playwright test
