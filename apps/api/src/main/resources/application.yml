server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: crithit-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/crithit}}
    username: ${DB_USER:${SPRING_DATASOURCE_USERNAME:crithit}}
    password: ${DB_PASS:${SPRING_DATASOURCE_PASSWORD:crithit_dev_password}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  data:
    redis:
      host: ${REDIS_HOST:${SPRING_DATA_REDIS_HOST:localhost}}
      port: ${REDIS_PORT:${SPRING_DATA_REDIS_PORT:6379}}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms

crithit:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  security:
    jwt:
      secret: ${JWT_SECRET:}
      issuer: ${JWT_ISSUER:crithit-api}
      access-expiration-seconds: ${JWT_ACCESS_EXPIRATION_SECONDS:900}
      refresh-expiration-seconds: ${JWT_REFRESH_EXPIRATION_SECONDS:604800}
    visitor-hash-salt: ${VISITOR_HASH_SALT:crithit-dev-visitor-salt-change-me}
    cookie-secure: ${COOKIE_SECURE:false}
  admin-seed:
    email: ${ADMIN_SEED_EMAIL:}
    password: ${ADMIN_SEED_PASSWORD:}
    display-name: ${ADMIN_SEED_NAME:Editor-Chefe}
  ai:
    api-key: ${AI_API_KEY:${LLM_API_KEY:}}
    base-url: ${AI_BASE_URL:${LLM_PROVIDER_BASE_URL:https://api.openai.com/v1}}
    model: ${AI_MODEL:${LLM_CHAT_MODEL:gpt-4o-mini}}
    embedding-model: ${EMBEDDING_MODEL:${LLM_EMBEDDING_MODEL:text-embedding-3-small}}
    embedding-dimensions: ${LLM_EMBEDDING_DIMENSIONS:1536}
    timeout-ms: ${LLM_TIMEOUT_MS:25000}
    max-retries: ${LLM_MAX_RETRIES:3}
  rss:
    enabled: ${RSS_SCHEDULER_ENABLED:true}
    cron: ${RSS_CRON_EXPRESSION:0 */15 * * * *}
    max-concurrent-fetches: ${RSS_MAX_CONCURRENT_FETCHES:12}
    connect-timeout-ms: ${RSS_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${RSS_READ_TIMEOUT_MS:10000}
    max-payload-bytes: ${RSS_MAX_PAYLOAD_BYTES:5242880}
    dedup-similarity-threshold: ${DEDUP_SIMILARITY_THRESHOLD:0.82}
    dedup-window-hours: ${DEDUP_WINDOW_HOURS:72}
    circuit-failure-threshold: ${RSS_CIRCUIT_FAILURE_THRESHOLD:5}
    circuit-base-cooldown-minutes: ${RSS_CIRCUIT_BASE_COOLDOWN_MINUTES:15}
    user-agent: "CritHitEditorialBot/1.0 (+https://crithit.com.br)"
  revalidate:
    url: ${WEB_REVALIDATE_URL:${REVALIDATE_WEBHOOK_URL:http://localhost:3000/api/revalidate}}
    secret: ${WEB_REVALIDATE_SECRET:${REVALIDATE_SECRET:}}
    enabled: ${WEB_REVALIDATE_ENABLED:true}
  notifications:
    discord-webhook-url: ${DISCORD_WEBHOOK_URL:}
    telegram-bot-token: ${TELEGRAM_BOT_TOKEN:}
    telegram-chat-id: ${TELEGRAM_CHAT_ID:}
    app-web-public-url: ${APP_WEB_PUBLIC_URL:${NEXT_PUBLIC_SITE_URL:http://localhost:3000}}

logging:
  level:
    br.com.crithit: INFO
